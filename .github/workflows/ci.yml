name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # ubuntu-latest moved to Ubuntu 26.04 (Oct 2026), which has no Python 3.8 build for
    # actions/setup-python; 3.8 runs on ubuntu-22.04 so the supported floor stays tested.
    runs-on: ${{ matrix.python == '3.8' && 'ubuntu-22.04' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.8", "3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: pytest (dev only; the tool itself needs no package)
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pytest -q
      - name: the package installs and its entry point runs
        run: |
          python -m pip install .
          vast-paralon-dual --help
          vast-paralon-dual --version

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ruff (E, F, W; config in pyproject.toml)
        run: |
          python -m pip install ruff
          ruff check .
      - name: README stays a summary (80 lines max, four H2 sections; the rest is docs/REFERENCE.md)
        shell: python
        run: |
          import sys
          allowed = ("Before you start", "Quick start", "What it does", "Get help")
          lines = open("README.md", encoding="utf-8").read().splitlines()
          bad = []
          if len(lines) > 80:
              bad.append(f"README.md is {len(lines)} lines (max 80): move the detail to docs/REFERENCE.md")
          fence = False
          for n, line in enumerate(lines, 1):
              if line.lstrip().startswith("```"):
                  fence = not fence
              elif not fence and line.startswith("## ") and not line[3:].strip().startswith(allowed):
                  bad.append(f"README.md:{n}: H2 {line[3:].strip()!r} is not one of: {', '.join(allowed)}")
          print("\n".join(bad) or f"README.md: {len(lines)} lines, H2 sections ok")
          sys.exit(1 if bad else 0)
