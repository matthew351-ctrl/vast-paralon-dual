name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.8", "3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: pytest (dev only; the tool itself needs no package)
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pytest -q
      - name: the package installs and its entry point runs
        run: |
          python -m pip install .
          vast-paralon-dual --help
          vast-paralon-dual --version

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ruff (E, F, W; config in pyproject.toml)
        run: |
          python -m pip install ruff
          ruff check .
